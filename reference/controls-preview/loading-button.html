<!doctype html>
<html data-mode="day" lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../controls.css">
<style>
  body { margin: 0; padding: 28px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  
</style>
</head>
<body>

<div class="col">
  <div class="row">
    <button class="btn btn--primary btn--loading">Saving</button>
    <button class="btn btn--secondary btn--loading">Syncing</button>
    <button class="btn btn--ghost btn--loading">Cancelling</button>
    <button class="btn btn--destructive btn--loading">Removing</button>
  </div>
  <div class="row">
    <button class="btn btn--primary btn--loading btn--sm">SM</button>
    <button class="btn btn--primary btn--loading">DEFAULT</button>
    <button class="btn btn--primary btn--loading btn--lg">LG</button>
  </div>
</div>

</body>
</html>
