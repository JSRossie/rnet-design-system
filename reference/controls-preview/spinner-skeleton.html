<!doctype html>
<html data-mode="day" lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../controls.css">
<style>
  body { margin: 0; padding: 28px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  
</style>
</head>
<body>

<div class="col">
  <div class="row" style="gap:24px;align-items:center;">
    <span class="spinner spinner--sm"></span>
    <span class="spinner"></span>
    <span class="spinner spinner--lg"></span>
    <span style="font-family:var(--font-mono);font-size:10px;letter-spacing:1.5px;color:var(--fg-3);text-transform:uppercase;">SYNCING…</span>
    <span style="font-family:var(--font-mono);font-size:10px;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase;display:inline-flex;align-items:center;gap:8px;"><span class="spinner spinner--sm"></span> REBUILDING INDEX</span>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px;">
    <div class="col" style="gap:8px;">
      <span class="skel skel--title"></span>
      <span class="skel skel--line" style="width:90%;"></span>
      <span class="skel skel--line" style="width:60%;"></span>
      <span class="skel skel--line" style="width:75%;"></span>
    </div>
    <div class="col" style="gap:8px;">
      <span class="skel skel--title" style="width:30%;"></span>
      <span class="skel skel--line" style="width:100%;"></span>
      <span class="skel skel--line" style="width:80%;"></span>
    </div>
  </div>
</div>

</body>
</html>
