<!doctype html>
<html data-mode="night" lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../controls.css">
<style>
  body { margin: 0; padding: 28px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  
</style>
</head>
<body>

<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);">
  <div class="stat" style="border:0;">
    <div class="stat__label"><span class="ic nf"></span>UPTIME</div>
    <div class="stat__value">99.997<span class="unit">%</span><span class="stat__trend stat__trend--up">↑ 0.003</span></div>
  </div>
  <div class="stat" style="border:0;">
    <div class="stat__label"><span class="ic nf"></span>THROUGHPUT</div>
    <div class="stat__value">2.4<span class="unit">GB/S</span><span class="stat__trend stat__trend--down">↓ 0.1</span></div>
  </div>
  <div class="stat" style="border:0;">
    <div class="stat__label"><span class="ic nf"></span>NODES</div>
    <div class="stat__value">42<span class="unit">/42</span><span class="stat__trend stat__trend--flat">FLAT</span></div>
  </div>
</div>

</body>
</html>
