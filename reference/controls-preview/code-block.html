<!doctype html>
<html data-mode="day" lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../controls.css">
<style>
  body { margin: 0; padding: 28px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  
</style>
</head>
<body>

<div class="col">
  <div class="codeblock-frame">
    <div class="codeblock-frame__head">
      <span><span class="nf"></span> /etc/rnet/core.toml</span>
      <span>TOML</span>
    </div>
    <pre class="codeblock"><span class="tk-com"># R—Net core configuration</span>
<span class="tk-key">node_id</span>   = <span class="tk-str">"edge-dr-01"</span>
<span class="tk-key">region</span>    = <span class="tk-str">"austin-tx"</span>
<span class="tk-key">retries</span>   = <span class="tk-num">3</span>
<span class="tk-key">interval</span>  = <span class="tk-str">"PT15M"</span>

[<span class="tk-key">backup</span>]
<span class="tk-key">target</span>    = <span class="tk-str">"s3://rnet-arch/dr"</span>
<span class="tk-key">retention</span> = <span class="tk-num">90</span></pre>
  </div>
</div>

</body>
</html>
