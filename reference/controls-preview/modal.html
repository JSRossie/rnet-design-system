<!doctype html>
<html data-mode="day" lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../controls.css">
<style>
  body { margin: 0; padding: 28px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .grp { display: flex; flex-direction: column; gap: 10px; }
  .grp .lbl { font-family: var(--font-mono); font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--fg-3); }
  
</style>
</head>
<body>

<div style="position:relative;height:380px;background:color-mix(in oklab, var(--ink) 18%, transparent);border:1px solid var(--rule);">
  <div class="modal" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:520px;">
    <div class="modal__head">
      <div>
        <div class="modal__eyebrow">ACTION · IRREVERSIBLE</div>
        <div class="modal__title">Decommission edge-dr-01?</div>
      </div>
      <button class="alert__close nf" aria-label="close" style="font-size:18px;"></button>
    </div>
    <div class="modal__body">
      <p style="margin:0 0 12px 0;font-size:14px;line-height:1.6;color:var(--fg-1);">
        This will remove the node from the cluster, revoke its credentials, and archive its logs. The action cannot be undone from this surface.
      </p>
      <div class="alert alert--warn" style="padding:12px 14px;">
        <span class="alert__icon nf"></span>
        <div class="alert__body">
          <div class="alert__title">CAUTION</div>
          <div class="alert__text" style="font-size:12px;">3 services still bind to this node. Migrate before continuing.</div>
        </div>
      </div>
    </div>
    <div class="modal__foot">
      <button class="btn btn--ghost">Cancel</button>
      <button class="btn btn--destructive">Decommission</button>
    </div>
  </div>
</div>

</body>
</html>
