<!doctype html>
<html data-mode="night" lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../controls.css">
<style>
  body { margin: 0; padding: 28px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .grp { display: flex; flex-direction: column; gap: 10px; }
  .grp .lbl { font-family: var(--font-mono); font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--fg-3); }
  
</style>
</head>
<body>

<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);">
  <div class="stat" style="border:0;">
    <div class="stat__label"><span class="ic nf"></span>UPTIME</div>
    <div class="stat__value">99.997<span class="unit">%</span></div>
  </div>
  <div class="stat" style="border:0;">
    <div class="stat__label"><span class="ic nf"></span>NODES</div>
    <div class="stat__value">42<span class="unit">/42</span></div>
  </div>
  <div class="stat" style="border:0;">
    <div class="stat__label"><span class="ic nf"></span>THROUGHPUT</div>
    <div class="stat__value">2.4<span class="unit">GB/S</span></div>
  </div>
  <div class="stat" style="border:0;">
    <div class="stat__label"><span class="ic nf"></span>LATENCY</div>
    <div class="stat__value">3<span class="unit">MS</span></div>
  </div>
</div>

</body>
</html>
