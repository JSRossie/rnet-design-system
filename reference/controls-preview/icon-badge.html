<!doctype html>
<html data-mode="day" lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../controls.css">
<style>
  body { margin: 0; padding: 28px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  
</style>
</head>
<body>

<div class="col">
  <div class="row" style="gap:22px;align-items:center;">
    <button class="btn btn--secondary btn--icon has-icon-badge" aria-label="notifications">
      <span class="nf"></span>
      <span class="icon-badge">3</span>
    </button>
    <button class="btn btn--secondary btn--icon has-icon-badge" aria-label="alerts">
      <span class="nf"></span>
      <span class="icon-badge icon-badge--alert">12</span>
    </button>
    <button class="btn btn--secondary btn--icon has-icon-badge" aria-label="messages">
      <span class="nf"></span>
      <span class="icon-badge icon-badge--accent">1</span>
    </button>
    <button class="btn btn--secondary btn--icon has-icon-badge" aria-label="settings">
      <span class="nf"></span>
      <span class="icon-badge icon-badge--dot icon-badge--warn"></span>
    </button>
    <button class="btn btn--secondary btn--icon has-icon-badge" aria-label="updates">
      <span class="nf"></span>
      <span class="icon-badge icon-badge--dot icon-badge--ok"></span>
    </button>
  </div>
  <div class="row" style="gap:18px;align-items:center;">
    <div class="avatar has-icon-badge"><span>JR</span><span class="icon-badge icon-badge--dot icon-badge--ok"></span></div>
    <div class="avatar has-icon-badge"><span>MK</span><span class="icon-badge icon-badge--dot icon-badge--warn"></span></div>
    <div class="avatar avatar--lg has-icon-badge"><span>TS</span><span class="icon-badge">2</span></div>
  </div>
</div>

</body>
</html>
